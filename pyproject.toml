[project]
name = "kresko-harness"
version = "0.1.0"
description = "Python/pyinfra experiment harness for Kresko: provisions nodes, deploys payloads, runs commands, collects artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyinfra>=3.0",
  "paramiko>=3.4",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
