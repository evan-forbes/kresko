[project]
name = "kresko-py-prototype"
version = "0.1.0"
description = "Prototype Python/pyinfra orchestration layer for Kresko experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyinfra>=3.0",
  "paramiko>=3.4",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kresko_py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
