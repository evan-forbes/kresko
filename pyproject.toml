[project]
name = "kresko-harness"
version = "0.1.0"
description = "Kresko fleet orchestration: provision, deploy to, run on, collect from, and tear down geographically distributed Zcash nodes (the `kresko` Python package + `kresko-fleet` CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyinfra>=3.0",
  "paramiko>=3.4",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

# The Rust binary owns the `kresko` command (genesis/mine/txblast/...). The
# Python fleet console is a separate tool, exposed as `kresko-fleet`
# (equivalently `python -m kresko`).
[project.scripts]
kresko-fleet = "kresko.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kresko"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
