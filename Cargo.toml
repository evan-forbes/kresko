[package]
name = "kresko"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
secp256k1 = "0.29"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false }
# Zakura crates, pinned to a tagged release so Cargo fetches them directly (no
# sibling checkout needed). Cargo.lock pins the exact commit. For local Zakura
# co-development, see .cargo/config.toml.example.
#
# Kept under the `zebra_*` extern names via `package =` so the existing
# `zebra_chain::...` paths throughout this crate keep compiling; Zakura is the
# continuation of these crates under a new name.
zebra-chain = { package = "zakura-chain", git = "https://github.com/zakura-core/zakura", tag = "v1.0.3-rc0", features = ["internal-miner"] }
zebrad = { package = "zakura", git = "https://github.com/zakura-core/zakura", tag = "v1.0.3-rc0" }
zebra-jsonl-trace = { package = "zakura-jsonl-trace", git = "https://github.com/zakura-core/zakura", tag = "v1.0.3-rc0" }
zcash_primitives = { version = "0.29", features = ["transparent-inputs"] }
zcash_protocol = "0.10"
zcash_address = "0.13"
zcash_transparent = "0.9"
orchard = "0.15"
sapling-crypto = "0.7"
incrementalmerkletree = "0.8"
shardtree = "0.6"
zcash_note_encryption = "0.4.1"
ff = "0.13"
jubjub = "0.10"
bls12_381 = "0.8"
rand_core_06 = { package = "rand_core", version = "0.6" }


[patch.crates-io]
# zcash_primitives with the Orchard proving-key cache (valargroup/librustzcash
# @ kresko-provingkey-cache). Same 0.29.0 source, one memoized key -- ~2.3x
# faster steady-state transaction building. Drop once the cache lands upstream.
zcash_primitives = { git = "https://github.com/valargroup/librustzcash", branch = "kresko-provingkey-cache" }
