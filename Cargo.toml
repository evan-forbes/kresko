[package]
name = "kresko"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
secp256k1 = "0.29"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false }
# NU7 testnet Zebra crates, pinned to a tagged release so Cargo fetches them
# directly (no sibling checkout needed). Cargo.lock pins the exact commit.
# For local Zebra co-development, see .cargo/config.toml.example.
zebra-chain = { git = "https://github.com/valargroup/zebra", tag = "nu7-testnet-v0.1.0", features = ["internal-miner"] }
zebrad = { git = "https://github.com/valargroup/zebra", tag = "nu7-testnet-v0.1.0" }
zebra-jsonl-trace = { git = "https://github.com/valargroup/zebra", tag = "nu7-testnet-v0.1.0", version = "0.1.0" }
zcash_primitives = { version = "0.26", features = ["transparent-inputs"] }
zcash_protocol = "0.7"
zcash_address = "0.10"
zcash_transparent = "0.6"
orchard = "0.11"
sapling-crypto = "0.5"
incrementalmerkletree = "0.8"
shardtree = "0.6"
zcash_note_encryption = "0.4"
ff = "0.13"
jubjub = "0.10"
bls12_381 = "0.8"
rand_core_06 = { package = "rand_core", version = "0.6" }
