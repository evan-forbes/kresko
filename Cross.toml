# Legacy cross configuration for Ubuntu-compatible kresko binaries.
# Requires: cargo install cross --git https://github.com/cross-rs/cross
# Usage:   cross build --release --target x86_64-unknown-linux-gnu
#
# Note: the supported path is `make ubuntu`, which uses scripts/build-ubuntu.sh
# and Docker so RocksDB/libclang/protobuf are built in a known Ubuntu image.

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
pre-build = [
    "apt-get update && apt-get install -y libclang-dev protobuf-compiler"
]
